name: Checks
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
  traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const issue = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|refs?)\s+(?:[\w.-]+\/[\w.-]+)?#\d+/i.test(body);
            const docs = /https:\/\/(?:kaw393939\.github\.io\/awareness-briefing\/[^\s)]*|github\.com\/kaw393939\/awareness-briefing\/blob\/[^\s)]+\/docs\/[^\s)]+)/i.test(body);
            if (!issue) core.setFailed('Include Closes #123 or Refs #123 (full owner/repo#123 is supported).');
            if (!docs) core.setFailed('Include a full documentation page URL or a repository docs/ file URL.');
